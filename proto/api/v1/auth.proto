syntax = "proto3";

package api.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "shared/v1/user.proto";
import "sphere/errors/errors.proto";

service AuthService {
  rpc RegisterWithPassword(RegisterWithPasswordRequest) returns (RegisterWithPasswordResponse) {
    option (google.api.http) = {
      post: "/api/auth/register"
      body: "*"
    };
  }
  rpc LoginWithPassword(LoginWithPasswordRequest) returns (LoginWithPasswordResponse) {
    option (google.api.http) = {
      post: "/api/auth/login"
      body: "*"
    };
  }
}

message RegisterWithPasswordRequest {
  string username = 1 [(buf.validate.field).required = true];
  string password = 2 [(buf.validate.field).string.min_len = 8];
}

message LoginWithPasswordRequest {
  string username = 1 [(buf.validate.field).required = true];
  string password = 2 [(buf.validate.field).required = true];
}

message RegisterWithPasswordResponse {
  string token = 1;
  shared.v1.User user = 2;
}

message LoginWithPasswordResponse {
  string token = 1;
  shared.v1.User user = 2;
}

enum AuthError {
  option (sphere.errors.default_status) = 500;

  AUTH_ERROR_UNSPECIFIED = 0;
  AUTH_ERROR_INVALID_CREDENTIALS = 1000 [(sphere.errors.options) = {
    status: 401
    reason: "INVALID_CREDENTIALS"
    message: "invalid username or password"
  }];
  AUTH_ERROR_USERNAME_TAKEN = 1001 [(sphere.errors.options) = {
    status: 409
    reason: "USERNAME_TAKEN"
    message: "username is already registered"
  }];
  AUTH_ERROR_INVALID_USERNAME = 1002 [(sphere.errors.options) = {
    status: 400
    reason: "INVALID_USERNAME"
    message: "username must contain between 3 and 64 characters"
  }];
}
