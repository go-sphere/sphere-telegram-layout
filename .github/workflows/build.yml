name: CI

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      # Not `make init`: it re-records codegen.sha256, which would hide the
      # very drift the baseline check below looks for.
      - name: Install tools
        run: make install
      - name: Generate
        run: make gen/all
      # api/** is gitignored; codegen.sha256 is its tracked digest baseline.
      # A mismatch means generator output changed without a baseline update.
      - name: Check generated code baseline
        run: make codegen-check
      # Generation must not leave go.mod/go.sum behind: a diff means the
      # template's declarations no longer cover what its generators emit.
      - name: Check generated dependencies
        run: git diff --exit-code -- go.mod go.sum
      - name: Build
        run: make build
      - name: Test
        run: make test
