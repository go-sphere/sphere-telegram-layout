name: CI

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      # `make init` would also refresh buf dependencies (buf dep update) and
      # the example config; CI wants the committed buf.lock instead, so it
      # installs the tools and generates in explicit steps.
      - name: Install tools
        run: make install
      - name: Generate
        run: make gen/all
      # Generation must not leave go.mod/go.sum behind: a diff means the
      # template's declarations no longer cover what its generators emit.
      - name: Check generated dependencies
        run: git diff --exit-code -- go.mod go.sum
      - name: Build
        run: make build
      - name: Test
        run: make test
